name: Full suite reliability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, redis, ffmpeg]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: reelforge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d reelforge"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: ${{ matrix.mode == 'redis' && 'redis:8.2.3-alpine' || '' }}
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/reelforge?schema=public
      REDIS_URL: ${{ matrix.mode == 'redis' && 'redis://127.0.0.1:6379/0' || '' }}
      FFMPEG_PATH: ${{ matrix.mode == 'ffmpeg' && '/usr/bin/ffmpeg' || '/nonexistent/ffmpeg' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with: { version: 12.16.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm db:generate
      - if: matrix.mode == 'ffmpeg'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Run the full suite three times
        run: |
          set -o pipefail
          result=0
          for attempt in 1 2 3; do
            pnpm test 2>&1 | tee "full-suite-$attempt.txt" || result=1
          done
          exit "$result"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-suite-${{ matrix.mode }}
          path: full-suite-*.txt
          retention-days: 14
