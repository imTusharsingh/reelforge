name: Temporary Core 56 Format
on:
  push:
    branches:
      - fix/core-56-atomic-planning-preconditions
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-56-atomic-planning-preconditions
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/api/src/modules/idea/idea.integration.test.ts \
            apps/api/src/modules/idea/idea.service.test.ts \
            apps/api/src/modules/script/script.controller.ts \
            apps/api/src/modules/script/script.integration.test.ts \
            apps/api/src/modules/script/script.service.test.ts \
            apps/api/src/modules/script/script.service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/idea/idea.integration.test.ts apps/api/src/modules/idea/idea.service.test.ts apps/api/src/modules/script/script.controller.ts apps/api/src/modules/script/script.integration.test.ts apps/api/src/modules/script/script.service.test.ts apps/api/src/modules/script/script.service.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(core): apply Prettier to Core 56 changes"
            git push origin HEAD:fix/core-56-atomic-planning-preconditions
          fi
