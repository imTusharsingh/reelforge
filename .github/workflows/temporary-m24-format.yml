name: Temporary M24 branch formatter
on:
  push:
    branches:
      - fix/m24-planning-api-contract
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/m24-planning-api-contract
          persist-credentials: true
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format only the six M24 Core changed TypeScript files
        run: |
          pnpm exec prettier --write \
            apps/api/src/modules/idea/idea.controller.ts \
            apps/api/src/modules/idea/idea.planning-contract.test.ts \
            apps/api/src/modules/idea/idea.service.ts \
            apps/api/src/modules/script/script.controller.ts \
            apps/api/src/modules/script/script.planning-contract.test.ts \
            apps/api/src/modules/script/script.service.ts
      - name: Commit only formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/src/modules/idea/idea.controller.ts apps/api/src/modules/idea/idea.planning-contract.test.ts apps/api/src/modules/idea/idea.service.ts apps/api/src/modules/script/script.controller.ts apps/api/src/modules/script/script.planning-contract.test.ts apps/api/src/modules/script/script.service.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(core): apply repository Prettier to M24 API fix"
            git push origin HEAD:refs/heads/fix/m24-planning-api-contract
          fi
