name: Process Policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Current pull request number to revalidate
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: process-policy-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  policy:
    name: Process Policy
    if: github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The event base is immutable for this execution. Manual dispatch uses
      # current main; the checker rejects it unless it equals the current base.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha || 'refs/heads/main' }}
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with: { version: 12.16.1 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .node-version }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate current metadata and candidate blobs as data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          NODE_USE_ENV_PROXY: "1"
        run: node scripts/check-process-policy.mjs
